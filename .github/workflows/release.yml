name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

      # jsDelivr caches how a version range (@0.3, @latest) resolves for up to
      # twelve hours per edge, so the demo and CDN users would keep getting the
      # previous release. Purge the range and exact-version paths for the files
      # the package ships.
      - name: Purge jsDelivr
        run: |
          v=$(node -p "require('./package.json').version")
          major_minor=${v%.*}
          for tag in "$v" "$major_minor" "${v%%.*}" latest; do
            for f in dist/index.js dist/index.cjs dist/index.d.ts; do
              curl -fsS "https://purge.jsdelivr.net/npm/geo-coord@$tag/$f" > /dev/null || echo "purge skipped for @$tag/$f"
            done
          done
